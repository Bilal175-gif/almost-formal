name: Cloudflare staging preparation

on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy the frontend to the staging Worker after validation"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_backend:
    name: Validate Node API (no Workers deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w @almost-formal/api

  frontend:
    name: Build Cloudflare frontend
    runs-on: ubuntu-latest
    needs: validate_backend
    env:
      CF_WORKERS: "1"
      API_URL: ${{ vars.STAGING_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.STAGING_CLOUDINARY_CLOUD_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check staging API origin
        run: |
          node -e 'const u=new URL(process.env.API_URL || ""); if(u.protocol!=="https:" || /^(localhost|127\.0\.0\.1)$/.test(u.hostname)) process.exit(1)'
      - run: npm run cf:build -w @almost-formal/web
      - name: Deploy staging frontend only
        if: ${{ inputs.deploy_staging }}
        run: npm run cf:deploy:staging -w @almost-formal/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
