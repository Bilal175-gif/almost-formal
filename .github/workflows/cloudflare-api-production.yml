name: Deploy live API Worker to Cloudflare

# Manual only. Run AFTER the D1 migrations have been applied remotely
# and the Neon -> D1 data migration has been verified (see CUTOVER.md).
# This deploys code only; it does not migrate data or create the admin.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check Cloudflare credentials are configured
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$API_URL" || { echo 'Missing PRODUCTION_API_URL variable'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w @almost-formal/api
      - name: Deploy API Worker (production)
        working-directory: apps/api
        run: npx wrangler deploy --env production
      - name: Check live API health
        run: |
          response=$(curl --fail --silent --show-error --max-time 120 \
            --header 'Accept: application/json' "$API_URL/api/health")
          node -e 'const data=JSON.parse(process.argv[1]); if(data.service!=="almost-formal-api" || data.ok!==true) process.exit(1)' "$response"
          echo "Live API health OK: $response"
