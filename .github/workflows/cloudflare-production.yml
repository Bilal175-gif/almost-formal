name: Deploy live website to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_WORKERS: "1"
      # The API is now the Cloudflare Worker (Hono + D1), NOT Render.
      # Set the repository variable PRODUCTION_API_URL to the live API
      # Worker origin, e.g. https://almost-formal-api.<subdomain>.workers.dev
      # (GitHub Settings -> Secrets and variables -> Actions -> Variables).
      # Do NOT point this at the Render URL again: the frontend's /api
      # rewrites proxy to this origin, and the API Worker is the only
      # backend after cutover (see CUTOVER.md).
      API_URL: ${{ vars.PRODUCTION_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dmwgexmef
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check Cloudflare credentials are configured
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$API_URL" || { echo 'Missing PRODUCTION_API_URL variable: set it to the live API Worker origin (see CUTOVER.md)'; exit 1; }
      - run: npm ci
      - name: Check production API
        run: |
          response=$(curl --fail --silent --show-error --max-time 120 \
            --header 'Accept: application/json' "$API_URL/api/health")
          node -e 'const data=JSON.parse(process.argv[1]); if(data.service!=="almost-formal-api" || data.ok!==true) process.exit(1)' "$response"
      - run: npm run typecheck
      - run: npm run cf:build -w @almost-formal/web
      - name: Deploy production Worker
        working-directory: apps/web
        run: npx opennextjs-cloudflare deploy --env production
