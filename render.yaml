services:
  - type: web
    name: almost-formal-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: cloudinary
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: PUBLIC_CACHE_TTL_SECONDS
        value: 30
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
